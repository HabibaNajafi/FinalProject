<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-box">
        <h1>Sign in</h1>

        <form>
            <label>User Name</label>
            <input id="username" type="text" placeholder="Enter YOur Name">
            <label>Last Name</label>
            <input id="username" type="text" placeholder="Enter YOur last Name">

            <label>Phone Neumber</label>
            <input id="username" type="number" placeholder="Enter YOur phone Number ">

            <label>Email</label>
            <input id="username" type="email" placeholder="Enter YOur Email">


            <label>Password</label>
            <input id="password" type="password" placeholder="****">

            <a href="Home.html" id="submitBtn">Sign in</a>
        </form>

        
    </div>
    <script src="./signin.js"></script>
    <link rel="stylesheet" href="./login.css">
    
</body>
</html>
